name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        go-version: [ "1.22", "1.23" ]

    name: Go ${{ matrix.go-version }}

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6

      - name: setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  parity:
    name: Ruby ↔ Go parity
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: environment
        run: |
          echo "ruby: $(ruby --version)"
          echo "go:   $(go version)"
          ruby -e 'require "sqlite3"; puts "sqlite3 gem: " + SQLite3::VERSION'

      # Regenerate fixtures from Ruby, then run the Go fixture tests against
      # them. Any drift between implementations fails the job.
      - name: regenerate fixtures
        run: bundle exec ruby script/generate_fixtures.rb

      - name: assert fixtures unchanged
        run: |
          if ! git diff --quiet spec/fixtures; then
            echo "::error::Fixtures are stale — run script/generate_fixtures.rb and commit."
            git --no-pager diff spec/fixtures
            exit 1
          fi

      - name: Go build (surface compile errors early)
        run: go build ./...

      - name: Go fixture tests
        run: go test -run Fixture -v ./...

      - name: CLI parity
        run: script/cli_parity.sh
