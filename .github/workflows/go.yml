name: Go

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    runs-on: ubuntu-latest

    # The Go module lives in go/ (Ruby at the root, Rust in rust/).
    defaults:
      run:
        working-directory: go

    strategy:
      fail-fast: false
      matrix:
        go-version: [ "1.22", "1.23" ]

    name: Go ${{ matrix.go-version }}

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6

      - name: setup Go ${{ matrix.go-version }}
        uses: actions/setup-go@v6
        with:
          go-version: ${{ matrix.go-version }}
          cache: false

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: test
        run: go test ./... -race

  parity:
    name: Ruby ↔ Go parity
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      # ruby/setup-ruby with bundler-cache populates vendor/bundle/, which
      # leaves a vendor/ directory at the module root. Go's default is to
      # auto-detect vendor mode from that path — force module mode so it
      # ignores the bundler artifacts.
      GOFLAGS: "-mod=mod"
    steps:
      - uses: actions/checkout@v6
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true
      - uses: actions/setup-go@v6
        with:
          go-version: "1.22"
          cache: false

      # Regenerate fixtures from Ruby, then run the Go fixture tests against
      # them. Any drift between implementations fails the job.
      - name: regenerate fixtures
        run: bundle exec ruby script/generate_fixtures.rb

      - name: assert fixtures unchanged
        run: |
          if ! git diff --quiet spec/fixtures; then
            echo "::error::Fixtures are stale — run script/generate_fixtures.rb and commit."
            git --no-pager diff spec/fixtures
            exit 1
          fi

      - name: Go fixture tests
        working-directory: go
        run: go test -count=1 -run Fixture -v ./...

      - name: CLI parity
        run: script/cli_parity.sh
