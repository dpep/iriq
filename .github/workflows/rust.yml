name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust-version: [ "stable" ]

    name: Rust ${{ matrix.rust-version }}

    defaults:
      run:
        working-directory: rust

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v7

      - name: setup Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}
          components: rustfmt, clippy

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Tests run first so a lint nit never hides a real failure. Each
      # step gets `if: always()` so the whole matrix runs even when an
      # earlier step failed — you see every result at once instead of
      # one-at-a-time.

      - name: build
        run: cargo build --workspace
        if: always()

      - name: test
        run: cargo test --workspace
        if: always()

      - name: fmt
        run: cargo fmt --check
        if: always()

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        if: always()

      # Library consumers can drop the bundled C SQLite build with
      # `default-features = false`. Without a gate this configuration rots
      # silently — every sqlite-only test and helper needs its cfg.
      - name: test (no default features)
        run: cargo test --workspace --no-default-features
        if: always()

      - name: clippy (no default features)
        run: cargo clippy --workspace --all-targets --no-default-features -- -D warnings
        if: always()

  parity:
    name: Ruby ↔ Rust parity
    runs-on: ubuntu-latest
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"
          bundler-cache: true

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Regenerate fixtures from Ruby (the reference implementation), then
      # verify the committed copies match. Any drift fails the job before
      # the Rust fixture tests even run.
      - name: regenerate fixtures
        run: bundle exec ruby script/generate_fixtures.rb

      - name: regenerate calibration corpus
        run: bundle exec ruby script/build_calibration.rb

      - name: regenerate URL calibration corpus
        run: bundle exec ruby script/build_url_calibration.rb

      - name: assert fixtures unchanged
        run: |
          if ! git diff --quiet spec/fixtures; then
            echo "::error::Fixtures are stale — run script/generate_fixtures.rb + script/build_calibration.rb and commit."
            git --no-pager diff spec/fixtures
            exit 1
          fi

      - name: build Rust binary (release, with sqlite)
        working-directory: rust
        run: cargo build --release --bin iriq

      - name: CLI parity
        run: script/cli_parity.sh
