name: Rust

on:
  push:
    branches: [ main ]
  pull_request:
    types: [ opened, edited, synchronize ]

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        rust-version: [ "stable" ]

    name: Rust ${{ matrix.rust-version }}

    defaults:
      run:
        working-directory: rust

    steps:
      - name: clone ${{ github.repository }}
        uses: actions/checkout@v6

      - name: setup Rust ${{ matrix.rust-version }}
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust-version }}

      - name: cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Tests run first so a lint nit never hides a real failure. Each
      # step gets `if: always()` so the whole matrix runs even when an
      # earlier step failed — you see every result at once instead of
      # one-at-a-time.

      - name: build
        run: cargo build --workspace
        if: always()

      - name: test
        run: cargo test --workspace
        if: always()

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
        if: always()

  parity:
    name: Rust ↔ Go parity
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        with:
          go-version: "1.23"
          cache: false

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: build Go binary (with sqlite)
        working-directory: go
        run: go build -tags sqlite -o ../bin/iriq ./cmd/iriq

      - name: build Rust binary (release, with sqlite)
        working-directory: rust
        run: cargo build --release --bin iriq

      - name: CLI parity
        run: script/rust_parity.sh
