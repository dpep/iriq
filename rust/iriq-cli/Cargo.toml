[package]
name = "iriq-cli"
version = "0.29.1"
edition = "2021"
description = "CLI binary for iriq — IRI extraction, normalization, and clustering."
license = "MIT"
repository = "https://github.com/dpep/iriq"
authors = ["Daniel Pepper"]

[[bin]]
name = "iriq"
path = "src/main.rs"

[dependencies]
iriq = { path = "../iriq", version = "0.29", features = ["sqlite"] }
serde_json = { version = "1", features = ["preserve_order"] }
