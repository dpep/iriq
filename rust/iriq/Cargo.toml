[package]
name = "iriq"
version = "0.34.0"
edition = "2021"
description = "IRI/URL extraction, normalization, and shape clustering."
license = "MIT"
repository = "https://github.com/dpep/iriq"
homepage = "https://github.com/dpep/iriq"
documentation = "https://docs.rs/iriq"
readme = "README.md"
keywords = ["url", "iri", "uri", "parser", "normalize"]
categories = ["parser-implementations", "command-line-utilities", "text-processing"]
authors = ["Daniel Pepper"]
exclude = ["tests/fixtures/*"]

# One crate ships both the library (src/lib.rs) and the `iriq` CLI
# (src/main.rs) — the idiomatic Rust shape (cf. ripgrep), not the Go
# package+cmd split. `cargo install iriq` builds the binary; `iriq = "0.x"`
# pulls the library.
[[bin]]
name = "iriq"
path = "src/main.rs"

# SQLite is on by default — `cargo install iriq` and the Homebrew formula get
# the full CLI unchanged. Library consumers who only want the parser,
# extractor, or normalizer can skip the bundled C SQLite build with
# `default-features = false`.
[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite"]

[dependencies]
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
once_cell = "1"
rusqlite = { version = "0.32", features = ["bundled"], optional = true }

[dev-dependencies]
proptest = "1"
